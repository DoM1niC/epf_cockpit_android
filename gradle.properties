org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

android.useAndroidX=true
android.nonTransitiveRClass=true
android.defaults.buildfeatures.buildconfig=true

kotlin.code.style=official
# Room 2.6.1 + KSP2 stolpert über `suspend fun …: Unit` (JVM-Signatur "V") und
# wirft `IllegalStateException: unexpected jvm signature V` im DaoProcessor.
# KSP1 hat den Bug nicht; Room ≥ 2.7.0 ebenfalls — sobald das stable ist, kann
# die Zeile raus und die Room-Version hoch.
ksp.useKSP2=false
