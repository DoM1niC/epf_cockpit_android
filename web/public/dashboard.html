<!doctype html>
<html lang="de" class="h-full">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>EPF Cockpit Live</title>
  <link rel="stylesheet" href="/dist/app.css" />
  <link rel="stylesheet" href="/vendor/uplot/uPlot.min.css" />
  <link rel="stylesheet" href="/vendor/leaflet/leaflet.css" />
</head>
<body class="h-full bg-[var(--color-surface-0)] text-[var(--color-on-surface)] antialiased">
  <header class="px-4 sm:px-6 py-3 sm:py-4 flex flex-wrap items-center gap-x-3 gap-y-2 border-b border-white/5 sticky top-0 z-10 bg-[var(--color-surface-0)]/90 backdrop-blur">
    <h1 class="text-lg sm:text-xl font-semibold tracking-tight flex items-center gap-2">
      <!-- bike (lucide) -->
      <svg class="icon w-5 h-5 text-[var(--color-brand-teal)]" viewBox="0 0 24 24" aria-hidden="true"><circle cx="18.5" cy="17.5" r="3.5"/><circle cx="5.5" cy="17.5" r="3.5"/><circle cx="15" cy="5" r="1"/><path d="M12 17.5V14l-3-3 4-3 2 3h2"/></svg>
      EPF Cockpit Live
    </h1>
    <span id="conn-dot"
          class="inline-block w-2.5 h-2.5 rounded-full bg-gray-500"
          title="Kein Scooter verbunden"></span>
    <span id="conn-text" class="text-sm text-[var(--color-on-surface-dim)] truncate max-w-[40vw]">Kein Scooter</span>
    <nav class="ml-auto flex gap-3 sm:gap-4 text-sm text-[var(--color-on-surface-dim)]">
      <a class="hover:text-[var(--color-brand-teal)] inline-flex items-center gap-1.5" href="/">
        <svg class="icon w-4 h-4" viewBox="0 0 24 24" aria-hidden="true"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/></svg>
        Live
      </a>
      <a class="hover:text-[var(--color-brand-teal)] inline-flex items-center gap-1.5" href="/history">
        <svg class="icon w-4 h-4" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/><path d="M12 7v5l4 2"/></svg>
        Verlauf
      </a>
      <a class="hover:text-[var(--color-brand-teal)] inline-flex items-center gap-1.5" href="/obs">
        <svg class="icon w-4 h-4" viewBox="0 0 24 24" aria-hidden="true"><path d="m22 8-6 4 6 4V8Z"/><rect width="14" height="12" x="2" y="6" rx="2" ry="2"/></svg>
        OBS
      </a>
    </nav>
  </header>

  <main class="p-3 sm:p-6 grid gap-4 sm:gap-6 max-w-7xl mx-auto">
    <!-- Big tiles -->
    <section class="grid grid-cols-2 md:grid-cols-3 gap-3 sm:gap-4">
      <div class="rounded-2xl bg-[var(--color-surface-1)] p-4 sm:p-5">
        <div class="text-xs uppercase tracking-wide text-[var(--color-on-surface-dim)] flex items-center gap-1.5">
          <!-- gauge -->
          <svg class="icon w-4 h-4" viewBox="0 0 24 24" aria-hidden="true"><path d="m12 14 4-4"/><path d="M3.34 19a10 10 0 1 1 17.32 0"/></svg>
          Geschwindigkeit
        </div>
        <div class="mt-2 text-3xl sm:text-4xl md:text-5xl font-semibold text-[var(--color-brand-teal)] tabular-nums">
          <span id="t-speed">--</span><span class="text-base sm:text-lg md:text-xl text-[var(--color-on-surface-dim)] ml-1">km/h</span>
        </div>
      </div>
      <div class="rounded-2xl bg-[var(--color-surface-1)] p-4 sm:p-5">
        <div class="text-xs uppercase tracking-wide text-[var(--color-on-surface-dim)] flex items-center gap-1.5">
          <!-- battery -->
          <svg class="icon w-4 h-4" viewBox="0 0 24 24" aria-hidden="true"><rect width="16" height="10" x="2" y="7" rx="2" ry="2"/><line x1="22" x2="22" y1="11" y2="13"/></svg>
          Akku
        </div>
        <div class="mt-2 text-3xl sm:text-4xl md:text-5xl font-semibold text-[var(--color-brand-amber)] tabular-nums">
          <span id="t-batt">--</span><span class="text-base sm:text-lg md:text-xl text-[var(--color-on-surface-dim)] ml-1">%</span>
        </div>
      </div>
      <div class="rounded-2xl bg-[var(--color-surface-1)] p-4 sm:p-5 col-span-2 md:col-span-1">
        <div class="text-xs uppercase tracking-wide text-[var(--color-on-surface-dim)] flex items-center gap-1.5">
          <!-- zap -->
          <svg class="icon w-4 h-4" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 14a1 1 0 0 1-.78-1.63l9.9-10.2a.5.5 0 0 1 .86.46l-1.92 6.02A1 1 0 0 0 13 10h7a1 1 0 0 1 .78 1.63l-9.9 10.2a.5.5 0 0 1-.86-.46l1.92-6.02A1 1 0 0 0 11 14z"/></svg>
          Leistung
        </div>
        <div class="mt-2 text-3xl sm:text-4xl md:text-5xl font-semibold text-[var(--color-brand-magenta)] tabular-nums">
          <span id="t-power">--</span><span class="text-base sm:text-lg md:text-xl text-[var(--color-on-surface-dim)] ml-1">W</span>
        </div>
      </div>
      <div class="rounded-2xl bg-[var(--color-surface-2)] p-3 sm:p-4">
        <div class="text-xs uppercase tracking-wide text-[var(--color-on-surface-dim)] flex items-center gap-1.5">
          <!-- plug-zap -->
          <svg class="icon w-3.5 h-3.5" viewBox="0 0 24 24" aria-hidden="true"><path d="M6.3 20.3a2.4 2.4 0 0 0 3.4 0L12 18l-6-6-2.3 2.3a2.4 2.4 0 0 0 0 3.4Z"/><path d="m2 22 3-3"/><path d="M7.5 13.5 10 11"/><path d="M10.5 16.5 13 14"/><path d="m18 3-4 4h6l-4 4"/></svg>
          Spannung
        </div>
        <div class="mt-1 text-xl sm:text-2xl font-medium tabular-nums"><span id="t-volt">--</span><span class="text-sm text-[var(--color-on-surface-dim)] ml-1">V</span></div>
      </div>
      <div class="rounded-2xl bg-[var(--color-surface-2)] p-3 sm:p-4">
        <div class="text-xs uppercase tracking-wide text-[var(--color-on-surface-dim)] flex items-center gap-1.5">
          <!-- activity -->
          <svg class="icon w-3.5 h-3.5" viewBox="0 0 24 24" aria-hidden="true"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/></svg>
          Strom
        </div>
        <div class="mt-1 text-xl sm:text-2xl font-medium tabular-nums"><span id="t-amp">--</span><span class="text-sm text-[var(--color-on-surface-dim)] ml-1">A</span></div>
      </div>
      <div class="rounded-2xl bg-[var(--color-surface-2)] p-3 sm:p-4 col-span-2 md:col-span-1">
        <div class="text-xs uppercase tracking-wide text-[var(--color-on-surface-dim)] flex items-center gap-1.5">
          <!-- thermometer -->
          <svg class="icon w-3.5 h-3.5" viewBox="0 0 24 24" aria-hidden="true"><path d="M14 4v10.54a4 4 0 1 1-4 0V4a2 2 0 0 1 4 0Z"/></svg>
          Controller
        </div>
        <div class="mt-1 text-xl sm:text-2xl font-medium tabular-nums"><span id="t-temp">--</span><span class="text-sm text-[var(--color-on-surface-dim)] ml-1">°C</span></div>
      </div>
    </section>

    <!-- Status chips -->
    <section class="flex flex-wrap gap-2 text-xs sm:text-sm">
      <span id="chip-parking"
            class="px-3 py-1 rounded-full bg-[var(--color-surface-2)] text-[var(--color-on-surface-dim)] inline-flex items-center gap-1.5">
        <!-- circle-parking -->
        <svg class="icon w-3.5 h-3.5" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="10"/><path d="M9 17V7h4a3 3 0 0 1 0 6H9"/></svg>
        Parking: --
      </span>
      <span id="chip-ridemode"
            class="px-3 py-1 rounded-full bg-[var(--color-surface-2)] text-[var(--color-on-surface-dim)] inline-flex items-center gap-1.5">
        <!-- footprints -->
        <svg class="icon w-3.5 h-3.5" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 16v-2.38C4 11.5 2.97 10.5 3 8c.03-2.72 1.49-6 4.5-6C9.37 2 10 3.8 10 5.5c0 3.11-2 5.66-2 8.68V16a2 2 0 1 1-4 0Z"/><path d="M20 20v-2.38c0-2.12 1.03-3.12 1-5.62-.03-2.72-1.49-6-4.5-6C14.63 6 14 7.8 14 9.5c0 3.11 2 5.66 2 8.68V20a2 2 0 1 0 4 0Z"/><path d="M16 17h4"/><path d="M4 13h4"/></svg>
        Modus: --
      </span>
      <span id="chip-scooter"
            class="px-3 py-1 rounded-full bg-[var(--color-surface-2)] text-[var(--color-on-surface-dim)] truncate max-w-[60vw] inline-flex items-center gap-1.5">
        <!-- bike -->
        <svg class="icon w-3.5 h-3.5" viewBox="0 0 24 24" aria-hidden="true"><circle cx="18.5" cy="17.5" r="3.5"/><circle cx="5.5" cy="17.5" r="3.5"/><circle cx="15" cy="5" r="1"/><path d="M12 17.5V14l-3-3 4-3 2 3h2"/></svg>
        Scooter: --
      </span>
    </section>

    <!-- Charts mit Zeitraum-Auswahl -->
    <section class="grid gap-3 sm:gap-4">
      <div class="flex items-center gap-2 flex-wrap">
        <span class="text-xs uppercase tracking-wide text-[var(--color-on-surface-dim)] mr-1 inline-flex items-center gap-1.5">
          <!-- calendar-range -->
          <svg class="icon w-3.5 h-3.5" viewBox="0 0 24 24" aria-hidden="true"><rect width="18" height="18" x="3" y="4" rx="2" ry="2"/><line x1="16" x2="16" y1="2" y2="6"/><line x1="8" x2="8" y1="2" y2="6"/><line x1="3" x2="21" y1="10" y2="10"/><path d="M17 14h-6"/><path d="M13 18H7"/></svg>
          Zeitraum
        </span>
        <div id="range-chips" class="flex gap-1.5 flex-wrap"></div>
        <span id="range-status" class="ml-auto text-xs text-[var(--color-on-surface-dim)]"></span>
      </div>
      <div class="grid md:grid-cols-2 gap-3 sm:gap-4">
        <div class="rounded-2xl bg-[var(--color-surface-1)] p-3 sm:p-4">
          <div class="text-xs uppercase tracking-wide text-[var(--color-on-surface-dim)] mb-2 inline-flex items-center gap-1.5">
            <svg class="icon w-3.5 h-3.5" viewBox="0 0 24 24" aria-hidden="true"><path d="m12 14 4-4"/><path d="M3.34 19a10 10 0 1 1 17.32 0"/></svg>
            Geschwindigkeit
          </div>
          <div id="chart-speed" class="w-full"></div>
        </div>
        <div class="rounded-2xl bg-[var(--color-surface-1)] p-3 sm:p-4">
          <div class="text-xs uppercase tracking-wide text-[var(--color-on-surface-dim)] mb-2 inline-flex items-center gap-1.5">
            <svg class="icon w-3.5 h-3.5" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 14a1 1 0 0 1-.78-1.63l9.9-10.2a.5.5 0 0 1 .86.46l-1.92 6.02A1 1 0 0 0 13 10h7a1 1 0 0 1 .78 1.63l-9.9 10.2a.5.5 0 0 1-.86-.46l1.92-6.02A1 1 0 0 0 11 14z"/></svg>
            Leistung
          </div>
          <div id="chart-power" class="w-full"></div>
        </div>
        <div class="rounded-2xl bg-[var(--color-surface-1)] p-3 sm:p-4 md:col-span-2">
          <div class="text-xs uppercase tracking-wide text-[var(--color-on-surface-dim)] mb-2 inline-flex items-center gap-1.5">
            <!-- battery -->
            <svg class="icon w-3.5 h-3.5" viewBox="0 0 24 24" aria-hidden="true"><rect width="16" height="10" x="2" y="7" rx="2" ry="2"/><line x1="22" x2="22" y1="11" y2="13"/></svg>
            Akku
          </div>
          <div id="chart-batt" class="w-full"></div>
        </div>
      </div>
    </section>

    <!-- Live-Karte. Versteckt bis das erste location-Frame ankommt — wenn der
         User die Standort-Übermittlung in der App nicht aktiviert hat, bleibt
         hier nichts zu sehen. -->
    <section id="live-map-section" class="hidden">
      <div class="rounded-2xl bg-[var(--color-surface-1)] p-3 sm:p-4">
        <div class="text-xs uppercase tracking-wide text-[var(--color-on-surface-dim)] mb-2 inline-flex items-center gap-1.5">
          <!-- map-pin -->
          <svg class="icon w-3.5 h-3.5" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0Z"/><circle cx="12" cy="10" r="3"/></svg>
          Standort live
          <span id="live-map-meta" class="ml-auto text-[var(--color-on-surface-dim)] normal-case tracking-normal"></span>
        </div>
        <div class="relative">
          <div id="live-map" class="w-full rounded-xl overflow-hidden" style="height: 320px; z-index: 0;"></div>
          <!-- Zoom-Slider-Overlay (vertikal, links). z-index 401 = über Leaflet-Controls. -->
          <div class="absolute left-2 top-2 z-[401] bg-[var(--color-surface-1)]/85 backdrop-blur rounded-lg px-2 py-3 flex flex-col items-center gap-2 select-none">
            <span class="text-xs text-[var(--color-on-surface-dim)]">+</span>
            <input id="live-map-zoom" type="range" min="2" max="19" step="1"
                   class="live-map-zoom-slider" />
            <span class="text-xs text-[var(--color-on-surface-dim)]">−</span>
          </div>
          <!-- Layer-Switcher als Custom-Button-Stack (rechts oben).
               Dunkel-Glas-Look + Brand-Teal fuer aktive Auswahl. dashboard.js
               bindet die data-layer-Klicks und switched die Tile-Layer. -->
          <div id="live-map-layers"
               class="absolute right-2 top-2 z-[401] bg-[var(--color-surface-1)]/85 backdrop-blur rounded-lg p-1 flex flex-col gap-0.5 select-none text-xs font-medium">
            <button type="button" data-layer="osm"
                    class="map-layer-btn px-3 py-1.5 rounded-md text-[var(--color-on-surface-dim)] hover:text-white hover:bg-white/5 transition">Straße</button>
            <button type="button" data-layer="sat"
                    class="map-layer-btn px-3 py-1.5 rounded-md text-[var(--color-on-surface-dim)] hover:text-white hover:bg-white/5 transition">Satellit</button>
            <button type="button" data-layer="topo"
                    class="map-layer-btn px-3 py-1.5 rounded-md text-[var(--color-on-surface-dim)] hover:text-white hover:bg-white/5 transition">Topo</button>
          </div>
        </div>
      </div>
    </section>
  </main>

  <script src="/vendor/uplot/uPlot.iife.min.js"></script>
  <script src="/vendor/leaflet/leaflet.js"></script>
  <script src="/js/auth.js"></script>
  <script src="/js/dashboard.js"></script>
</body>
</html>
