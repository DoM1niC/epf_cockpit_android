<!doctype html>
<html lang="en" class="h-full">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>EPF Cockpit Live</title>
  <link rel="stylesheet" href="/dist/app.css" />
  <link rel="stylesheet" href="/vendor/uplot/uPlot.min.css" />
</head>
<body class="h-full bg-[var(--color-surface-0)] text-[var(--color-on-surface)] antialiased">
  <header class="px-6 py-4 flex items-center gap-3 border-b border-white/5">
    <h1 class="text-xl font-semibold tracking-tight">EPF Cockpit Live</h1>
    <span id="conn-dot"
          class="inline-block w-2.5 h-2.5 rounded-full bg-gray-500"
          title="No scooter connected"></span>
    <span id="conn-text" class="text-sm text-[var(--color-on-surface-dim)]">no scooter</span>
    <nav class="ml-auto flex gap-4 text-sm text-[var(--color-on-surface-dim)]">
      <a class="hover:text-[var(--color-brand-teal)]" href="/">Live</a>
      <a class="hover:text-[var(--color-brand-teal)]" href="/history">History</a>
      <a class="hover:text-[var(--color-brand-teal)]" href="/obs">OBS</a>
    </nav>
  </header>

  <main class="p-6 grid gap-6 max-w-7xl mx-auto">
    <!-- Big tiles -->
    <section class="grid grid-cols-2 md:grid-cols-3 gap-4">
      <div class="rounded-2xl bg-[var(--color-surface-1)] p-5">
        <div class="text-xs uppercase tracking-wide text-[var(--color-on-surface-dim)]">Speed</div>
        <div class="mt-2 text-5xl font-semibold text-[var(--color-brand-teal)]">
          <span id="t-speed">--</span><span class="text-xl text-[var(--color-on-surface-dim)] ml-1">km/h</span>
        </div>
      </div>
      <div class="rounded-2xl bg-[var(--color-surface-1)] p-5">
        <div class="text-xs uppercase tracking-wide text-[var(--color-on-surface-dim)]">Battery</div>
        <div class="mt-2 text-5xl font-semibold text-[var(--color-brand-amber)]">
          <span id="t-batt">--</span><span class="text-xl text-[var(--color-on-surface-dim)] ml-1">%</span>
        </div>
      </div>
      <div class="rounded-2xl bg-[var(--color-surface-1)] p-5">
        <div class="text-xs uppercase tracking-wide text-[var(--color-on-surface-dim)]">Power</div>
        <div class="mt-2 text-5xl font-semibold text-[var(--color-brand-magenta)]">
          <span id="t-power">--</span><span class="text-xl text-[var(--color-on-surface-dim)] ml-1">W</span>
        </div>
      </div>
      <div class="rounded-2xl bg-[var(--color-surface-2)] p-4">
        <div class="text-xs uppercase tracking-wide text-[var(--color-on-surface-dim)]">Voltage</div>
        <div class="mt-1 text-2xl font-medium"><span id="t-volt">--</span><span class="text-sm text-[var(--color-on-surface-dim)] ml-1">V</span></div>
      </div>
      <div class="rounded-2xl bg-[var(--color-surface-2)] p-4">
        <div class="text-xs uppercase tracking-wide text-[var(--color-on-surface-dim)]">Current</div>
        <div class="mt-1 text-2xl font-medium"><span id="t-amp">--</span><span class="text-sm text-[var(--color-on-surface-dim)] ml-1">A</span></div>
      </div>
      <div class="rounded-2xl bg-[var(--color-surface-2)] p-4">
        <div class="text-xs uppercase tracking-wide text-[var(--color-on-surface-dim)]">Controller</div>
        <div class="mt-1 text-2xl font-medium"><span id="t-temp">--</span><span class="text-sm text-[var(--color-on-surface-dim)] ml-1">°C</span></div>
      </div>
    </section>

    <!-- Status chips -->
    <section class="flex flex-wrap gap-2 text-sm">
      <span id="chip-parking"
            class="px-3 py-1 rounded-full bg-[var(--color-surface-2)] text-[var(--color-on-surface-dim)]">
        Parking: --
      </span>
      <span id="chip-ridemode"
            class="px-3 py-1 rounded-full bg-[var(--color-surface-2)] text-[var(--color-on-surface-dim)]">
        Mode: --
      </span>
      <span id="chip-scooter"
            class="px-3 py-1 rounded-full bg-[var(--color-surface-2)] text-[var(--color-on-surface-dim)]">
        Scooter: --
      </span>
    </section>

    <!-- Charts -->
    <section class="grid md:grid-cols-2 gap-4">
      <div class="rounded-2xl bg-[var(--color-surface-1)] p-4">
        <div class="text-xs uppercase tracking-wide text-[var(--color-on-surface-dim)] mb-2">Speed (last 5 min)</div>
        <div id="chart-speed" class="w-full"></div>
      </div>
      <div class="rounded-2xl bg-[var(--color-surface-1)] p-4">
        <div class="text-xs uppercase tracking-wide text-[var(--color-on-surface-dim)] mb-2">Power (last 5 min)</div>
        <div id="chart-power" class="w-full"></div>
      </div>
    </section>
  </main>

  <script src="/vendor/uplot/uPlot.iife.min.js"></script>
  <script src="/js/auth.js"></script>
  <script src="/js/dashboard.js"></script>
</body>
</html>
