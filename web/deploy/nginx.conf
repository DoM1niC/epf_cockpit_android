# /etc/nginx/sites-available/cockpit.3dns.eu
#
# Reverse proxy für epf-cockpit-web (Node-Server auf 127.0.0.1:8787).
#
# Voraussetzungen:
#   - Node-Service unter 127.0.0.1:8787 (siehe deploy/epf-cockpit-web.service).
#     In .env: BIND_ADDR=127.0.0.1 setzen, sonst lauscht Node auch öffentlich
#     und der Token-Gate ist die einzige Hürde.
#   - Let's-Encrypt-Zertifikat unter /etc/letsencrypt/live/cockpit.3dns.eu/
#     (z.B. via `certbot --nginx -d cockpit.3dns.eu`).
#   - Optional: htpasswd-Datei für die zusätzliche Basic-Auth-Schicht.
#
# Aktivieren:
#   ln -s /etc/nginx/sites-available/cockpit.3dns.eu /etc/nginx/sites-enabled/
#   nginx -t && systemctl reload nginx

# --- WebSocket-Upgrade-Map (einmalig im http{}-Kontext) --------------------
# Wenn die nginx-Hauptconfig diese Map nicht schon enthält, hier per
# `include /etc/nginx/conf.d/websocket-upgrade.conf;` einbinden oder
# direkt in nginx.conf legen.
#
# map $http_upgrade $connection_upgrade {
#   default upgrade;
#   ''      close;
# }

# --- Plain HTTP → HTTPS Redirect -------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name cockpit.3dns.eu;

    # Let's Encrypt ACME http-01 challenge bleibt erreichbar.
    location /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

# --- HTTPS Vhost -----------------------------------------------------------
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name cockpit.3dns.eu;

    ssl_certificate     /etc/letsencrypt/live/cockpit.3dns.eu/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/cockpit.3dns.eu/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;

    # HSTS — wenn dir das Vhost-Setup stabil ist, aktivieren:
    # add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Sane defaults.
    add_header X-Content-Type-Options nosniff       always;
    add_header X-Frame-Options          SAMEORIGIN  always;
    add_header Referrer-Policy          no-referrer always;

    # Token-URLs sollen NICHT im access.log landen (sonst leakt das Token in
    # Backups / Log-Aggregation). Wir loggen Method + Status, kein $request.
    log_format epf_safe '$remote_addr - "$request_method $uri" $status $body_bytes_sent';
    access_log /var/log/nginx/cockpit.3dns.eu.access.log epf_safe;
    error_log  /var/log/nginx/cockpit.3dns.eu.error.log warn;

    # Verbindungslimit pro IP, hilft gegen Token-Bruteforce.
    # limit_req_zone $binary_remote_addr zone=cockpit:10m rate=30r/s;  # in http{}
    # limit_req zone=cockpit burst=60 nodelay;

    client_max_body_size 1m;
    proxy_read_timeout 1d;   # Long-lived WebSockets müssen am Leben bleiben

    # --- App → Server (Ingest) ---------------------------------------------
    # Optional: NUR aus dem Mobilfunknetz / VPN zulassen. Kommentar entfernen
    # und die CIDRs anpassen.
    #
    # location = /ws/ingest {
    #     allow 10.0.0.0/8;        # VPN
    #     allow 178.0.0.0/8;       # Mobilfunk-Range (Beispiel)
    #     deny  all;
    #     # ... gleiche proxy_pass-Konfig wie unten ...
    # }

    location = /ws/ingest {
        proxy_pass         http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        $connection_upgrade;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # --- Server → Browser (Live-Broadcast) ---------------------------------
    location = /ws/live {
        proxy_pass         http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        $connection_upgrade;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # --- HTTP (HTML + JSON-API + Static) -----------------------------------
    # Optional: zusätzliche Basic-Auth-Schicht oben drauf. Auskommentieren
    # falls der Token allein reicht.
    #
    # location / {
    #     auth_basic           "EPF Cockpit";
    #     auth_basic_user_file /etc/nginx/htpasswd/cockpit;
    #     proxy_pass http://127.0.0.1:8787;
    #     ...
    # }

    location / {
        proxy_pass         http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }
}
